<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monzart Studios</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:white;
text-align:center;
}

header{
padding:25px;
background:#181818;
border-bottom:2px solid #444;
}

header h1{
font-size:48px;
}

header p{
color:#bbb;
margin-top:10px;
}

.hero{
padding:100px 20px;
}

.hero h2{
font-size:42px;
margin-bottom:20px;
}

.hero p{
font-size:20px;
color:#ccc;
max-width:700px;
margin:auto;
line-height:1.8;
}

.btn{
display:inline-block;
margin-top:40px;
padding:15px 40px;
background:#ffffff;
color:#000;
text-decoration:none;
border-radius:8px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
background:#999;
}

footer{
margin-top:120px;
padding:25px;
background:#181818;
color:#888;
}
</style>

</head>

<body>

<header>
<h1>MONZART</h1>
<p>Independent Game Studio</p>
</header>

<section class="hero">
<h2>Creating Worlds. Inspiring Players.</h2>

<p>
Welcome to Monzart Studios.
We build immersive games with passion, creativity, and unforgettable stories.
</p>

<a class="btn" href="#">Coming Soon</a>

</section>

<footer>
© 2026 Monzart Studios. All Rights Reserved.
</footer>

</body>
</html>
